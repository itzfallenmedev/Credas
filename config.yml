# ===========================================================================
# Credas — Configuration template
# ===========================================================================
# This file is safe to commit: it contains NO real credentials.
#
# Put your own values in config.local.yml (same keys, deep-merged over this
# file at startup) so your secrets never enter version control:
#
#     cp config.yml config.local.yml
#
# config.local.yml is gitignored. Anything you leave out here falls back to
# the defaults below.
# ===========================================================================

MongoURI: "mongodb://127.0.0.1:27017/credas"
DebugMode: false

# Discord user IDs with full staff access. Add your own ID(s).
# Enable Discord Developer Mode, then right-click yourself -> Copy User ID.
OwnerID: ["YOUR_DISCORD_USER_ID"]

# ===========================================================================
# DISCORD BOT
# Leave blank to run the store without the bot (logging/roles/auto-join off).
# ===========================================================================
Token: ""            # Bot token from the Developer Portal
GuildID: ""          # Your server ID (right-click server -> Copy ID)
autoJoinUsers: false # Add users to your server when they log in?

# ===========================================================================
# DISCORD OAUTH2 — required for login
# https://discord.com/developers/applications
# The redirect must EXACTLY match a Redirect URL in the portal.
# ===========================================================================
clientID: ""
clientSecret: ""
callbackURL: "http://localhost:3000/auth/discord/callback"

# ===========================================================================
# SESSIONS
# Generate a long random string (20+ characters). Rotating this signs
# every existing session out.
# ===========================================================================
secretKey: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"

Secure: false       # true when serving over HTTPS (secure-only cookie)
trustProxy: false   # true behind Cloudflare / Nginx / any reverse proxy
SessionExpires: "7d"

# ===========================================================================
# WEBSERVER
# baseURL must be the exact public URL, with NO trailing slash.
# ===========================================================================
baseURL: "http://localhost:3000"
Port: 3000

# ===========================================================================
# PAYMENTS — enable only what you actually use
# ===========================================================================
Payments:
  PayPal:
    Enabled: false        # REQUIRES a PayPal BUSINESS account
    clientID: ""
    clientSecret: ""

  Stripe:
    Enabled: false
    secretKey: ""

  Coinbase:
    Enabled: false
    ApiKey: ""
    WebhookSecret: ""
    # Also add an endpoint in the Coinbase dashboard:
    #   https://yourdomain.com/webhooks/coinbase

# ===========================================================================
# PRODUCT VERSIONS
# ===========================================================================
productVersions:
  autoDeleteOldFiles: false
  maxVersionsToKeep: 5

# ===========================================================================
# EMAILS — required for invoices and licence delivery
# provider: "sendgrid" or "smtp"
# ===========================================================================
EmailSettings:
  Enabled: false
  fromEmail: "store@yourdomain.com"
  provider: "sendgrid"

  sendGrid:
    token: ""            # required when provider is "sendgrid"

  smtp:
    host: ""             # required when provider is "smtp"
    port: 587
    secure: false        # true for SSL (465)
    user: ""
    password: ""

# ===========================================================================
# REDIRECTS
# Applied in order. Optional — delete this whole block if you do not use it.
#
#   path       incoming path, supports * and :named segments
#   target     destination, :named segments are substituted
#   method     optional, default GET
#   statusCode optional — 301/302/307/308, default 301
# ===========================================================================
Redirects: []
